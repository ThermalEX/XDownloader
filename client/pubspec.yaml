name: xdownloader
description: X video downloader with Flutter Material 3.
publish_to: none
version: 2.7.0+17

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.0
  dynamic_color: 1.9.0
  video_player: 2.14.1
  chewie: 1.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  video_player_platform_interface: 6.9.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  min_sdk_android: 26
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground_inset: 20
